<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="/layouts/taskLayout.html">
<head>
    <meta charset="UTF-8">
    <title>All Tasks</title>
    <link rel="stylesheet" type="text/css" href="/css/bootstrap.css">
</head>
<body>
<div layout:fragment="thirdFragment">
    <button class="btn btn-primary">+ Add New Task</button>
</div>
<div layout:fragment="firstFragment">
    <div class="col-12">
        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Email address</label>
            <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
        </div>
        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Example textarea</label>
            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
        </div>
    </div>
</div>
<div layout:fragment="secondFragment">
    <table class="table table-striped mt-3">
        <thead>
            <tr>
                <td>ID</td>
                <td>NAME</td>
                <td>DEADLINE DATE</td>
                <td>IS COMPLETED</td>
                <td>DETAILS</td>
            </tr>
        </thead>
        <tbody>
            <tr th:each="task :${tasks}">
                <td th:text="${task.getId()}"></td>
                <td th:text="${task.getName()}"></td>
                <td th:text="${task.getDeadlineDate()}"></td>
                <td th:if="${task.isCompleted()}" th:text="YES"></td>
                <td th:unless="${task.isCompleted()}" th:text="NO"></td>
                <td><a th:href="@{'/details/' + ${task.getId()}}">DETAILS</a></td>
            </tr>
        </tbody>
    </table>
</div>
<script type="text/javascript" src="/js/bootstrap.bundle.js"></script>
</body>
</html>
